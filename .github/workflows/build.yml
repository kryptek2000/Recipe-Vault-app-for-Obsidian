name: Build Recipe Vault

on:
push:
branches:
- main
pull_request:
branches:
- main

jobs:
build:
name: Build Application
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Bun
    uses: oven-sh/setup-bun@v2
    with:
      bun-version: latest

  - name: Install dependencies
    run: bun install --frozen-lockfile

  - name: Build application
    run: bun run build
```
